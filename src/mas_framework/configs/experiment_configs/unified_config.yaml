experiment:
  name: TAMAS
  output_root: experiments/TAMAS
  run_id: unified_template
  log_level: INFO

agents:
  model: qwen3-max-preview
  capability_coefficient: 8.4
  models:
    honest: qwen3-max-preview
    byzantine: qwen3-8b
  model_capability_coefficients:
    qwen3.6-max-preview: 8.85
    qwen3-max-preview: 8.4
    qwen3-8b: 7.25
  temperature: 0.0

collaboration:
  mode: magentic_one
  max_messages: 8

proposal:
  enabled: true
  builder_enabled: true
  verification_enabled: true
  weight_manager_enabled: true
  max_per_agent_per_case: 1
  verification:
    type: llm
    include_proposer_as_verifier: false
    self_confidence_threshold: 0.6
    dimension_weights: {
      "veracity": 0.35,
      "rationality": 0.20,
      "value": 0.20,
      "security": 0.25,
    }
  consensus:
    strategy: smart_quorum
    confidence_threshold: 0.6
    majority_threshold: 0.5
    strict_majority: true
    epsilon_ratio: 0.1
    epsilon: null
    use_dynamic_estimate: false
  weight_manager:
    alpha: 0.6
    beta: 0.4
    gamma: 5.0
    theta: 0.5
    proposal_window: 20
    vote_window: 30
    initial_vc: 0.5
    initial_hc: 0.5
  fisher_lda:
    enabled: false
    alpha_initial: 0.6
    beta_initial: 0.4
    M: 1

memory:
  user_id: tamas_shared
